<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Design 06 · 蓝色表身</title>

  <link rel="stylesheet" href="styles/common.css" />

  <!--
    字体说明：
    · VT323 / Share Tech Mono → LCD 数字时间 [待确认字体]
      原稿中的 "12:16" 使用 7 段式 LCD 显示字体，VT323 作为近似
    · Barlow Condensed 700    → "12" 小时标记、数字 [待确认字体]
    · Barlow 400/700          → "quado" 品牌名、辅助文字
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;700&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    /* ── 背景：极深碳纤维纹理 ── */
    /* [取色估值] #1e1e1e 底，细斜纹织物纹理 */
    /* [待替换为真实背景图] */
    body {
      background-color: #181818;
      background-image:
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 6px
        );
    }

    .clock-stage {
      position: relative;
      width: 1280px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── 背景大圆弧（表冠/表圈轮廓，极淡） ── */
    /*
      原稿顶部有一个超大圆的弧线部分从屏幕顶部延伸进来
      [取色估值] 白色 20% 透明度细线
    */
    .bg-arc {
      position: absolute;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      top: -280px;
      left: 50%;
      transform: translateX(-50%);
      border: 1.5px solid rgba(255,255,255,0.16);
      pointer-events: none;
    }

    /* 背景大圆内部的锯齿/纹理环（模拟仪表盘外圈） */
    .bg-knob-ring {
      position: absolute;
      width: 780px;
      height: 780px;
      border-radius: 50%;
      top: -220px;
      left: 50%;
      transform: translateX(-50%);
      /* 锯齿纹理用 repeating-conic-gradient 模拟 */
      background:
        repeating-conic-gradient(
          rgba(40,40,40,0.5) 0deg 2.5deg,
          rgba(20,20,20,0.5) 2.5deg 10deg
        );
      border: 1px solid rgba(60,60,60,0.5);
      pointer-events: none;
      overflow: hidden;
    }

    /* 锯齿环中心镂空 */
    .bg-knob-ring::after {
      content: '';
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      top: 50px;
      left: 50px;
      background: #181818;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.015) 0px,
        rgba(255,255,255,0.015) 1px,
        transparent 1px,
        transparent 6px
      );
    }

    /* ── 左侧 MARK 文字和槽口 ── */
    /* [取色估值] 小白字，含矩形槽 */
    .mark-label {
      position: absolute;
      left: 280px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
    }

    .mark-slot {
      width: 44px;
      height: 9px;
      background: rgba(50,50,50,0.9);
      border-radius: 2px;
      border: 1px solid #444;
      margin-bottom: 5px;
    }

    .mark-text {
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      color: #aaaaaa;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── 右侧分钟标记 "16" ── */
    .minute-marker {
      position: absolute;
      right: 278px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
      z-index: 4;
    }

    /* ── 主卡片（蓝色圆角矩形表身） ── */
    /*
      [取色估值] 深海军蓝 #1a3a6e → #1e4080
      大圆角（约 50-60px），模拟 Apple Watch 表面
    */
    .watch-card {
      position: relative;
      width: 310px;
      height: 420px;
      border-radius: 58px;
      background: linear-gradient(160deg,
        #1e4590 0%,
        #1a3a7a 40%,
        #152e62 100%
      );
      box-shadow:
        0 24px 70px rgba(0,0,0,0.88),
        0 8px 24px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.4),
        /* 内侧边缘深度阴影 */
        inset 2px 2px 8px rgba(0,0,0,0.3),
        inset -2px -2px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 20px 22px;
      z-index: 2;
    }

    /* ── 卡片内容 ── */

    /* "12" 小时标记（12点方向） */
    .card-hour-top {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 38px;
      color: #ffffff;
      line-height: 1;
      align-self: center;
      margin-bottom: 2px;
    }

    /* "quado" 品牌名 */
    /* [待确认] 品牌名是否为 "quado" 还是其他 */
    .card-brand {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #2a2a2a;  /* 原稿中接近卡片背景的深色，低对比度 */
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    /* LCD 时间显示槽（黑色圆角横条） */
    .lcd-slot {
      width: 270px;
      height: 68px;
      border-radius: 20px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 0 3px 12px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(255,255,255,0.02);
      margin-bottom: 14px;
    }

    .lcd-time {
      font-family: 'VT323', monospace;  /* [待确认字体] 7段 LCD 风格 */
      font-size: 60px;
      color: #ffffff;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    /* 日期（YYYYMMDD 格式） */
    .card-date {
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    /* 分隔空白 */
    .card-spacer { flex: 1; }

    /* IP 地址 */
    .card-ip {
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: #ffffff;
      opacity: 0.8;
      letter-spacing: 0.04em;
    }

    /* ── 卡片下方区域 ── */
    .below-card {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 3;
    }

    /* 电量百分比行（"1" 红 + "54%" 白 + "2" 橙） */
    .battery-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .bat-mark-1 { font-family: 'Barlow', sans-serif; font-size: 14px; color: #cc3333; }
    .bat-pct    { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #ffffff; }
    .bat-mark-2 { font-family: 'Barlow', sans-serif; font-size: 14px; color: #e08020; }

    /* 控制按钮行 */
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctrl-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3a3a3a, #1a1a1a);
      border: 1px solid #444;
      box-shadow: 0 2px 6px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .ctrl-label {
      font-family: 'Barlow', sans-serif;
      font-size: 9px;
      color: #666666;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    /* "3" 标记 */
    .ctrl-3 {
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      color: #888888;
      margin-top: 2px;
    }

    /* AMBIENT 文字 */
    .ambient-label {
      font-family: 'Barlow', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.20em;
      color: #555555;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── 分页指示点 ── */
    .page-dots {
      position: absolute;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 3;
    }

    .page-dots span {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
    }

    .page-dots span.active {
      background: rgba(255,255,255,0.80);
      width: 18px;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div class="clock-stage">

    <!-- 背景大圆弧（仪表盘轮廓） -->
    <div class="bg-knob-ring"></div>
    <div class="bg-arc"></div>

    <!-- 左侧 MARK 标签 -->
    <div class="mark-label">
      <div class="mark-slot"></div>
      <div class="mark-text">MARK</div>
    </div>

    <!-- 右侧分钟标记 -->
    <div class="minute-marker" id="d06-marker-min">16</div>

    <!-- 主蓝色卡片 -->
    <div class="watch-card">
      <!-- 12点方向小时数字 -->
      <div class="card-hour-top" id="d06-hour-top">12</div>
      <!-- 品牌名 -->
      <div class="card-brand">quado</div><!-- [待确认] 品牌名 -->
      <!-- LCD 时间槽 -->
      <div class="lcd-slot">
        <span class="lcd-time" id="d06-lcd-time">12:16</span>
      </div>
      <!-- 日期 (YYYYMMDD) -->
      <div class="card-date" id="d06-date">20240429</div>
      <!-- 空白撑开 -->
      <div class="card-spacer"></div>
      <!-- IP 地址 [待确认] 是否需要真实 IP -->
      <div class="card-ip">IP: 192.168.2.137</div>
    </div>

    <!-- 卡片下方控制区 -->
    <div class="below-card">
      <!-- 电量行 -->
      <div class="battery-row">
        <span class="bat-mark-1">1</span>
        <span class="bat-pct" id="d06-battery">54%</span>
        <span class="bat-mark-2">2</span>
      </div>
      <!-- 控制按钮 -->
      <div class="control-row">
        <span class="ctrl-label">Sample Play</span>
        <div class="ctrl-btn"></div>
        <div class="ctrl-btn"></div>
      </div>
      <div class="ctrl-3">3</div>
      <div class="ambient-label">AMBIENT</div>
    </div>

    <!-- 分页指示点 -->
    <div class="page-dots">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span>
      <span class="active"></span>
      <span></span><span></span>
    </div>

  </div><!-- /.clock-stage -->

  <script src="scripts/common.js"></script>
  <script>
    /**
     * design-06 更新逻辑
     * · 卡片内 LCD 时间 → HH:MM（12h 制）
     * · 12点方向小时数字 → 12h 小时
     * · 右侧分钟标记 → 当前分钟
     * · 日期 → YYYYMMDD 格式
     */
    function update() {
      var t   = getTime();
      var h   = t.hours;
      var m   = t.minutes;
      var now = t.now;
      var h12 = h % 12 || 12;

      var yyyy = now.getFullYear();
      var mm   = padZero(now.getMonth() + 1);
      var dd   = padZero(now.getDate());

      document.getElementById('d06-lcd-time').textContent  = padZero(h12) + ':' + padZero(m);
      document.getElementById('d06-hour-top').textContent  = h12;
      document.getElementById('d06-marker-min').textContent = padZero(m);
      document.getElementById('d06-date').textContent      = yyyy + mm + dd;
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
