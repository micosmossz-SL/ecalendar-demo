<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Design 01 · SVG 还原</title>
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/design-01-svg.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <main class="svg-stage">
    <section class="svg-frame">
      <img
        class="svg-clock"
        src="assets/design-01-full.svg"
        alt="Design 01 全量 SVG 设计稿还原"
        draggable="false"
      />

      <div class="live-marker live-marker-top" id="marker-hour">12</div>
      <div class="live-marker live-marker-right" id="marker-minute">00</div>
      <div class="live-marker live-marker-bottom" id="marker-second">00</div>

      <div class="live-time" aria-label="实时时间">
        <span class="live-hour" id="live-hour">12</span>
        <span class="live-colon" aria-hidden="true">:</span>
        <span class="live-minute" id="live-minute">00</span>
      </div>

      <div class="live-date" aria-label="实时日期">
        <div class="live-year" id="live-year">2026</div>
        <div class="live-month" id="live-month">04</div>
        <div class="live-day" id="live-day">05</div>
      </div>

      <div class="live-words" id="live-words">ELEVEN FORTYFOUR TO MIDNIGHT</div>
    </section>
  </main>

  <script src="scripts/common.js"></script>
  <script>
    function setMarkerPosition(id, turn, radiusPx) {
      var angle = turn * 360;
      var el = document.getElementById(id);
      el.style.transform =
        'translate(-50%, -50%) ' +
        'rotate(' + angle + 'deg) ' +
        'translateY(-' + radiusPx + 'px) ' +
        'rotate(' + (-angle) + 'deg)';
    }

    function updateDesign01Svg() {
      var t = getTime();
      var h12 = t.hours % 12 || 12;
      var hTurn = (h12 % 12 + t.minutes / 60 + t.seconds / 3600) / 12;
      var mTurn = (t.minutes + t.seconds / 60) / 60;
      var sTurn = t.seconds / 60;

      document.getElementById('live-hour').textContent = padZero(h12);
      document.getElementById('live-minute').textContent = padZero(t.minutes);

      document.getElementById('live-year').textContent = t.now.getFullYear();
      document.getElementById('live-month').textContent = padZero(t.now.getMonth() + 1);
      document.getElementById('live-day').textContent = padZero(t.now.getDate());

      document.getElementById('marker-hour').textContent = padZero(h12);
      document.getElementById('marker-minute').textContent = padZero(t.minutes);
      document.getElementById('marker-second').textContent = padZero(t.seconds);

      // 12 点在顶部（0turn），顺时针沿外圈移动。
      setMarkerPosition('marker-hour', hTurn, 282);
      setMarkerPosition('marker-minute', mTurn, 282);
      setMarkerPosition('marker-second', sTurn, 282);

    }

    updateDesign01Svg();
    setInterval(updateDesign01Svg, 1000);
  </script>
</body>
</html>
