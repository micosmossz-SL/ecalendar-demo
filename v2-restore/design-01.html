<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport 锁定为 1280，平板端不缩放。
    Fully Kiosk Browser 全屏展示时，页面会以 1280px 宽度渲染。
  -->
  <meta name="viewport" content="width=1280" />
  <title>Design 01 · profinDESIGN Clock</title>

  <!-- 共用基础样式 -->
  <link rel="stylesheet" href="styles/common.css" />
  <!-- design-01 专属样式 -->
  <link rel="stylesheet" href="styles/design-01.css" />

  <!--
    字体说明（[待确认字体]）：
    · 主时钟数字使用 Bebas Neue（Google Fonts 免费）作为近似替代。
      原设计字体未知，从截图判断为厚重窄体无衬线字体（可能是
      DIN Pro Condensed Bold、Barlow Condensed ExtraBold 等商业字体）。
    · 辅助文字使用 Oswald SemiBold。
    · 如需替换，在此处修改 Google Fonts 链接即可。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div class="clock-stage">

    <!--
      ── 表盘外圈三个动态标记 ──
      · #marker-hour   → 始终固定在 12 点钟方向（正上方），显示当前小时数
      · #marker-minute → 始终固定在  3 点钟方向（正右方），显示当前分钟数
      · #marker-second → 始终固定在  6 点钟方向（正下方），显示当前秒钟数
      坐标由 JS 初始化时一次性写入，每秒只更新文字数值，不改变位置。
    -->
    <div class="outer-marker" id="marker-hour">12</div>
    <div class="outer-marker" id="marker-minute">00</div>
    <div class="outer-marker" id="marker-second">00</div>

    <!-- ── 表盘主体（三层嵌套，由外到内）── -->
    <div class="watch-wrapper">

      <!-- 第一层：最外圈（整体轮廓 + 大阴影） -->
      <div class="watch-outer">

        <!-- 第二层：中间表圈（增加立体层次） -->
        <div class="watch-bezel">

          <!-- 第三层：内屏（最暗，凹陷效果） -->
          <div class="watch-face">

            <!--
              品牌水印背景字（aria-hidden 让屏幕阅读器忽略装饰性内容）
              [待确认] 水印字体与透明度
            -->
            <div class="brand-watermark" aria-hidden="true">
              <span class="bw-profin">profin</span><span class="bw-design">DESIGN</span>
            </div>

            <!-- 时间显示槽（深色凹槽） -->
            <div class="time-slot">
              <div class="time-display">
                <!-- 小时：白色 -->
                <span class="hours" id="hours">12</span>
                <!-- 冒号：两个白色圆点 -->
                <span class="colon" aria-hidden="true">
                  <span class="dot"></span>
                  <span class="dot"></span>
                </span>
                <!-- 分钟：黄色 -->
                <span class="minutes" id="minutes">00</span>
              </div>
            </div>

            <!-- 日期：年 / 月 / 日 纵向排列 -->
            <div class="date-display">
              <div class="year"      id="year">2026</div>
              <div class="month-num" id="month">3</div>
              <div class="day-num"   id="day">31</div>
            </div>

            <!--
              品牌 Logo（纯文字模拟版）
              [待确认] 实际 pd 图标文件（矢量/PNG），颜色与字形
            -->
            <div class="brand-logo">
              <div class="pd-icon" aria-label="pd">pd</div>
              <div class="pd-name">ProfinDesign</div>
            </div>

          </div><!-- /.watch-face -->
        </div><!-- /.watch-bezel -->
      </div><!-- /.watch-outer -->

    </div><!-- /.watch-wrapper -->

    <!--
      底部时间读白，由 JS 实时生成
      示例："ELEVEN FORTYFOUR TO MIDNIGHT"
      [待确认] 读白逻辑：是"距午夜"还是"距下一整点"？
    -->
    <div class="time-words" id="time-words">—</div>

  </div><!-- /.clock-stage -->


  <!-- 公共工具函数 -->
  <script src="scripts/common.js"></script>

  <script>
    /**
     * design-01 专属更新逻辑
     *
     * 外圈标记定位原理：
     *   三个标记始终位于表盘的 12 / 3 / 6 点钟方向（固定坐标，不旋转）。
     *   · 小时标记 → 正上方（angle = 0°）
     *   · 分钟标记 → 正右方（angle = 90°）
     *   · 秒钟标记 → 正下方（angle = 180°）
     *   每秒只更新各标记显示的数字，不改变坐标。
     *
     * CSS 中 .watch-wrapper 精确定位到 left:640px / top:390px，
     * 此处 CX/CY 与之对应。
     */

    // 表盘屏幕中心坐标（与 CSS 中 left:640px / top:390px 对齐）
    var CX = 640;
    var CY = 390;

    // 外圈标记到表盘中心的距离（px）[待确认]
    // 580px watch-outer 的外边缘距中心 290px，标记在外边缘再往外约 25px
    var OUTER_RADIUS = 315;

    /**
     * 初始化外圈标记坐标（只调用一次，坐标固定不变）
     * angle: 0° = 12点，90° = 3点，180° = 6点
     */
    function placeMarker(el, angleDeg) {
      var rad = (angleDeg - 90) * (Math.PI / 180);
      el.style.left = (CX + OUTER_RADIUS * Math.cos(rad)) + 'px';
      el.style.top  = (CY + OUTER_RADIUS * Math.sin(rad)) + 'px';
    }

    // 一次性定位，不再移动
    placeMarker(document.getElementById('marker-hour'),    0);   // 12 点
    placeMarker(document.getElementById('marker-minute'),  90);  // 3  点
    placeMarker(document.getElementById('marker-second'),  180); // 6  点

    /**
     * 每秒更新：时间数字、日期、读白、外圈标记数值
     */
    function update() {
      var t = getTime();
      var h = t.hours;
      var m = t.minutes;
      var s = t.seconds;

      // ── 主时间显示（12 小时制）──
      document.getElementById('hours').textContent   = h % 12 || 12;
      document.getElementById('minutes').textContent = padZero(m);

      // ── 日期 ──
      document.getElementById('year').textContent  = t.now.getFullYear();
      document.getElementById('month').textContent = t.now.getMonth() + 1;
      document.getElementById('day').textContent   = t.now.getDate();

      // ── 底部时间读白 ──
      document.getElementById('time-words').textContent = timeToWords(h, m);

      // ── 外圈标记数值（坐标已固定，只更新文字）──
      document.getElementById('marker-hour').textContent   = h % 12 || 12;
      document.getElementById('marker-minute').textContent = padZero(m);
      document.getElementById('marker-second').textContent = padZero(s);
    }

    // 立即执行一次，之后每秒更新
    update();
    setInterval(update, 1000);
  </script>

</body>
</html>
